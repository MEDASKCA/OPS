<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEDASKCA — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#eef3f8;
    --surface:#ffffff;
    --surface-dark:#0f1720;
    --text:#0c121a;
    --muted:#5b6573;
    --line:#d9e1ea;
    --teal:#14b8a6;
    --blue:#3b82f6;
    --shadow:0 30px 80px rgba(2,6,23,.18);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    overflow:hidden;
    background:
      radial-gradient(60% 50% at 78% 38%, rgba(59,130,246,.16) 0%, rgba(59,130,246,0) 58%),
      radial-gradient(44% 38% at 22% 18%, rgba(20,184,166,.14) 0%, rgba(20,184,166,0) 58%),
      linear-gradient(135deg, #fbfdff 0%, #f4f8fc 42%, #e8eef6 100%);
    background-size:120% 120%, 120% 120%, 100% 100%;
    animation:bgShift 18s ease-in-out infinite alternate;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(60% 60% at 82% 50%, rgba(15,23,32,.18) 0%, rgba(15,23,32,.06) 35%, transparent 70%),
      radial-gradient(70% 50% at 50% 110%, rgba(15,23,32,.08) 0%, transparent 70%);
    animation:ambientFloat 20s ease-in-out infinite alternate;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.12;
    background-image:
      linear-gradient(to right, rgba(12,18,26,.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(12,18,26,.04) 1px, transparent 1px);
    background-size:28px 28px;
    animation:gridDrift 30s linear infinite;
  }

  .container{
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
    padding:0 40px;
    position:relative;
    z-index:1;
  }

  .left{ max-width:430px; }

  h1{
    font-size:44px;
    line-height:1.08;
    font-weight:400;
    margin-bottom:12px;
    letter-spacing:-.01em;
  }

  .gradient{
    background:linear-gradient(135deg,var(--teal),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p{
    color:var(--muted);
    margin-bottom:18px;
    line-height:1.65;
  }

  .input-row{ display:flex; gap:10px; }

  input{
    flex:1;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(15,23,32,.08);
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(10px);
    color:var(--text);
    font-size:14px;
    box-shadow:0 8px 24px rgba(15,23,32,.05);
  }

  button{
    padding:14px 18px;
    border:none;
    border-radius:12px;
    font-weight:600;
    background:linear-gradient(135deg,var(--teal),var(--blue));
    color:#061018;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(59,130,246,.18);
  }

  .right{
    display:flex;
    justify-content:center;
    position:relative;
  }

  .right::before{
    content:"";
    position:absolute;
    width:460px;
    height:460px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(15,23,32,.22), rgba(59,130,246,.14), rgba(20,184,166,.10), transparent 68%);
    filter:blur(38px);
    z-index:-1;
    animation:haloFloat 14s ease-in-out infinite alternate;
  }

  .phone::before{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:43px;
    pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0) 28%, rgba(255,255,255,.06) 52%, rgba(255,255,255,0) 72%);
    opacity:.8;
  }

  

  .phone{
    width:286px;
    height:584px;
    border-radius:44px;
    background:
      linear-gradient(155deg, #15181d 0%, #07090c 26%, #1f242b 52%, #080b0f 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.10),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -10px 20px rgba(0,0,0,.28),
      0 34px 90px rgba(2,6,23,.42),
      0 12px 28px rgba(2,6,23,.18);
    position:relative;
    padding:10px;
    transform:rotate(-2deg);
  }

  .screen{
    width:100%;
    height:100%;
    border-radius:36px;
    background:linear-gradient(180deg,#ffffff 0%, #f8fbfe 100%);
    overflow:hidden;
    position:relative;
    box-shadow:
      inset 0 0 0 1px rgba(15,23,32,.04),
      inset 0 18px 30px rgba(255,255,255,.28);
  }

  .notch{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:124px;
    height:34px;
    background:linear-gradient(180deg,#0a0d12,#11161d);
    border-radius:18px;
    z-index:3;
    box-shadow:0 2px 6px rgba(0,0,0,.26);
  }

  .notch::before{
    content:"";
    position:absolute;
    left:50%;
    top:8px;
    transform:translateX(-50%);
    width:44px;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
  }

  .notch::after{
    content:"";
    position:absolute;
    right:18px;
    top:11px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#1d2430;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }

  .ui-stage{
    position:absolute;
    inset:52px 0 0 0;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    flex-direction:column;
    gap:16px;
    padding-top:34px;
  }

  .logo-mark{
    width:88px;
    height:88px;
    border-radius:50%;
    overflow:hidden;
    position:relative;
    margin:0 auto;
    animation:float 4s ease-in-out infinite;
    box-shadow:0 12px 28px rgba(15,23,32,.12);
  }

  .logo-mark::before{
    content:"";
    position:absolute;
    inset:-18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(20,184,166,.34), rgba(59,130,246,.24), transparent 72%);
    filter:blur(18px);
    z-index:0;
  }

  .logo-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    position:relative;
    z-index:1;
    border-radius:50%;
  }

  .brand-lockup{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .brand-name{
    font-size:14px;
    letter-spacing:.18em;
    color:#475569;
  }

  .tagline-rotator{
    position:relative;
    width:210px;
    height:18px;
    overflow:hidden;
    margin:0 auto;
  }

  .tagline-rotator span{
    position:absolute;
    inset:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    color:#7c8b9d;
    letter-spacing:.1em;
    opacity:0;
    transform:translateY(6px);
    animation:taglineFade 9s infinite;
  }

  .tagline-rotator span:nth-child(2){ animation-delay:3s; }
  .tagline-rotator span:nth-child(3){ animation-delay:6s; }

  @keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
    100%{transform:translateY(0)}
  }

  @keyframes bgShift{
    0%{background-position:0% 0%, 100% 0%, 0% 0%}
    100%{background-position:10% 10%, 90% 18%, 0% 0%}
  }

  @keyframes ambientFloat{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(1.5%,-1.5%,0) scale(1.03)}
  }

  @keyframes gridDrift{
    0%{transform:translate3d(0,0,0)}
    100%{transform:translate3d(-14px,-14px,0)}
  }

  @keyframes haloFloat{
    0%{transform:translate3d(0,0,0) scale(1)}
    100%{transform:translate3d(1.5%,-2%,0) scale(1.04)}
  }

  @keyframes taglineFade{
    0%, 8%{ opacity:0; transform:translateY(6px); }
    14%, 28%{ opacity:1; transform:translateY(0); }
    36%, 100%{ opacity:0; transform:translateY(-6px); }
  }

  @media(max-width:900px){
    body{
      padding-top:60px;
      justify-content:flex-start;
    }

    .container{
      flex-direction:column;
      text-align:center;
      gap:28px;
      padding:0 20px;
    }

    .left{
      max-width:100%;
    }

    h1{
      font-size:34px;
      line-height:1.15;
    }

    p{
      font-size:14px;
      line-height:1.6;
      margin-bottom:14px;
    }

    .input-row{
      flex-direction:column;
      gap:10px;
    }

    input, button{
      width:100%;
    }

    .right{
      margin-top:10px;
    }

    .phone{
      transform:none;
      scale:0.95;
    }

    .ui-stage{
      align-items:center;
    }

    .brand-lockup{
      width:100%;
      align-items:center;
      justify-content:center;
    }

    .tagline-rotator{
      width:100%;
      max-width:220px;
      margin:
  }
    .left{max-width:560px}
  }
</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h1>
      Operations,<br>
      <span class="gradient">made simple.</span>
    </h1>

    <p style="font-size:16px;line-height:1.7;color:#475569;margin-top:8px;">
      A clear view of what matters now so teams can move faster and stay aligned.
    </p>

    <p style="font-size:14px;line-height:1.7;color:#64748b;">
      Designed to reduce friction, surface change early, and keep work flowing with less effort.
    </p>

    <p>
      Built for teams that need clarity, speed, and control.
    </p>

    <div class="input-row">
      <input type="email" placeholder="Enter your email" />
      <button>Request access</button>
    </div>
  </div>

  <div class="right">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>

        <div class="ui-stage">
          <div class="brand-lockup">
            <div class="logo-mark">
              <img src="https://raw.githubusercontent.com/MEDASKCA/OPS/main/logo-medaskca.png" alt="MEDASKCA logo">
            </div>

            <div class="brand-name">MEDASKCA</div>

            <div class="tagline-rotator" aria-label="tagline">
              <span>Every case.</span>
              <span>Every setting.</span>
              <span>Every team.</span>
            </div>
          </div>
        </div>

      </div>

      </div>

      </div>
    </div>
  </div>

</div>

</body>
</html>
